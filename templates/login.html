<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Kirish | 35-Maktab So'rovnoma Portali</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-emerald-950 to-teal-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Ambient Orbs -->
    <div class="absolute -top-32 -right-32 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-teal-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-emerald-500/20 overflow-hidden relative z-10">
        
        <!-- Header -->
        <div class="p-8 text-center bg-gradient-to-b from-emerald-50/80 to-transparent border-b border-gray-100">
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-600 to-teal-700 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-600/30">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            <span class="inline-block px-3 py-1 bg-emerald-100 text-emerald-800 text-[11px] font-extrabold rounded-full mb-2">
                🏛️ 35-MAKTAB MA'MURIYATI
            </span>
            <h1 class="text-2xl font-black text-gray-900 tracking-tight">Admin Tizimiga Kirish</h1>
            <p class="text-xs text-gray-500 mt-1">So'rovnoma natijalari, tahlillar va hisobotlar boshqaruvi</p>
        </div>

        <!-- Form -->
        <form method="POST" class="p-8 space-y-5">
            
            {% if error %}
            <div class="p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-center space-x-2 animate-shake">
                <i data-lucide="alert-triangle" class="w-4 h-4 flex-shrink-0 text-red-600"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <div>
                <label for="password" class="block text-xs font-bold text-gray-700 mb-1.5">Maxfiy Admin Paroli</label>
                <div class="relative">
                    <input id="password" name="password" type="password" required autofocus placeholder="Admin parolini kiriting..." class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all pr-12">
                    <button type="button" onclick="togglePass()" class="absolute right-3.5 top-3 text-gray-400 hover:text-gray-600 transition-colors">
                        <i id="passIcon" data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 via-emerald-700 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center space-x-2">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span>Tizimga kirish</span>
            </button>

            <div class="text-center pt-2">
                <a href="/" class="text-xs font-semibold text-gray-500 hover:text-emerald-700 transition-colors inline-flex items-center space-x-1.5">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span>O'quvchilar anketasiga qaytish</span>
                </a>
            </div>

        </form>

    </div>

    <script>
        lucide.createIcons();

        function togglePass() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>

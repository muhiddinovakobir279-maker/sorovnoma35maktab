<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Kirish - Sorovnoma Natijalari</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-6 text-white text-center">
            <div class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-3 text-white">
                <i data-lucide="lock" class="w-7 h-7"></i>
            </div>
            <h1 class="text-xl font-bold">Admin Paneliga Kirish</h1>
            <p class="text-xs text-emerald-100 mt-1">So'rovnoma natijalari va boshqaruv jadvali</p>
        </div>

        <!-- Form -->
        <form method="POST" class="p-6 space-y-4">
            
            {% if error %}
            <div class="p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium flex items-center space-x-2">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <div>
                <label for="password" class="block text-xs font-bold text-gray-700 mb-1">Admin Paroli</label>
                <div class="relative">
                    <input id="password" name="password" type="password" required autofocus placeholder="Parolni kiriting..." class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none transition-all pr-10">
                    <button type="button" onclick="togglePass()" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
                        <i id="passIcon" data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-emerald-200 transition-all flex items-center justify-center space-x-1.5">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span>Kirish</span>
            </button>

            <div class="text-center pt-2">
                <a href="/" class="text-xs text-gray-500 hover:text-emerald-600 transition-colors flex items-center justify-center space-x-1">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span>So'rovnoma formasiga qaytish</span>
                </a>
            </div>

        </form>

    </div>

    <script>
        lucide.createIcons();

        function togglePass() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
